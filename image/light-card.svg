<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DQIX Battle Emulator – light card</title>
<desc>GitHub README card for DQIX Solo Travel Battle Emulator, light mode</desc>
<style>
  .bg { fill: #ffffff; }
  .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 0.8; }
  .title-main { font-family: sans-serif; font-size: 26px; font-weight: 700; fill: #1f2328; }
  .title-sub { font-family: sans-serif; font-size: 11px; fill: #656d76; letter-spacing: 2.5px; }
  .catch { font-family: sans-serif; font-size: 13px; fill: #656d76; font-style: italic; }
  .badge { fill: #ffffff; stroke: #d0d7de; stroke-width: 0.8; }
  .bt { font-family: sans-serif; font-size: 11px; font-weight: 500; }
  .divider { stroke: #d0d7de; stroke-width: 0.8; }
