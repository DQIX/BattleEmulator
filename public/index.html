<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DQ9 Battle Emulator - WebAssembly Console</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="dq9 バトルエミュレータコンソール">
    <meta property="og:description" content="ドラゴンクエストIX対応の一人旅スピードラン向けバトルエミュレータコンソール。総当たり探索や探索アルゴリズムを用いて戦闘行動の組み合わせを自動探索し、入力条件に基づく戦闘シミュレーション結果を取得できます。">
    <meta property="og:url" content="https://dqix.github.io/BattleEmulator/">
    <meta property="og:site_name" content="dq9 バトルエミュレータコンソール">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="https://dqix.github.io/BattleEmulator/ogp.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="dq9 バトルエミュレータコンソール">
    <meta name="twitter:description" content="DQ9一人旅スピードラン向けのバトルエミュレータコンソール。総当たり探索や探索アルゴリズムにより、戦闘行動の組み合わせを自動探索するバトルシミュレーションツールです。">
    <meta name="twitter:image" content="https://dqix.github.io/BattleEmulator/ogp.png">
    <meta name="twitter:site" content="@Daisuke76897125">
    <meta name="twitter:creator" content="@Daisuke76897125">

    <meta name="description" content="dq9 バトルエミュレータコンソールは、ドラゴンクエストIXの一人旅スピードラン向けに設計されたバトルエミュレーションツールです。総当たり探索や探索アルゴリズムを用いて戦闘行動の組み合わせを自動的に探索し、戦闘シミュレーションを行えます。">


    <script>
      (function () {
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("dq9Theme") || "lightSepia";
        const savedLang = localStorage.getItem("dq9Lang") || "ja";
        root.dataset.theme = savedTheme;
        root.dataset.lang = savedLang;
        root.lang = savedLang;
        window.APP_CONFIG = {
          themes: [
            "lightSepia",
            "light",
            "light2",
            "lightGray",
            "lightGrayPlus",
            "lightCool",
            "lightGreen",
            "lightHighContrast",
            "softGray",
            "warmPaper",
            "mistBlue",
            "blue",
            "gold",
            "pink",
            "DarkPlus",
            "deepDark",
            "darkAsh",
            "graphiteSoft",
            "darkMoss",
            "darkColorblind",
            "darkTritanopia"
          ],
          i18n: {
            en: {
              title: "DQ9 Battle Emulator",
              subtitle: "WebAssembly seed console for RTA analysis",
              emulator: "Emulator",
              input: "Input",
              inputHint: "Enter runs, Shift+Enter adds a line",
              seed: "Seed",
              dump: "Dump Table",
              dumpHint: "C++ dumpTable output",
              settings: "Settings",
              settingsHint: "Theme and language",
              log: "Log",
              logHint: "session output",
              timeLabel: "Time (H M S)",
              workers: "Workers",
              run: "Run Search",
              theme: "Theme",
              language: "Language",
              idle: "idle",
              ready: "ready",
              missing: "missing",
              waiting: "waiting",
              reserved: "reserved",
              seedHex: "Hex",
              seedDec: "Dec",
              seedDrift: "Drift",
              speed: "Speed",
              elapsed: "Elapsed",
              preload: "Preload"
            },
            ja: {
              title: "DQ9 Battle Emulator",
              subtitle: "RTA向けWebAssemblyシードコンソール",
              emulator: "バトルエミュ",
              input: "入力",
              inputHint: "Enterで実行、Shift+Enterで改行",
              seed: "シード",
              dump: "出力",
              dumpHint: "C++ dumpTableの出力",
              settings: "設定",
              settingsHint: "テーマと言語",
              log: "ログ",
              logHint: "セッション出力",
              timeLabel: "時間 (H M S)",
              workers: "ワーカー数",
              run: "検索開始",
              theme: "テーマ",
              language: "言語",
              idle: "待機",
              ready: "準備完了",
              missing: "未検出",
              waiting: "待機中",
              reserved: "予約",
              seedHex: "Hex",
              seedDec: "Dec",
              seedDrift: "誤差",
              speed: "速度",
              elapsed: "経過",
              preload: "プリロード"
            }
          }
        };
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="hero-left">
          <div class="hero-title" data-i18n="title">DQ9 Battle Emulator</div>
          <div class="hero-subtitle" data-i18n="subtitle">
            WebAssembly seed console for RTA analysis
          </div>
        </div>
        <div class="hero-links">
          <a class="hero-link" href="https://note.com/zeppeki0711/n/neac461916cc8">チャートはこちら</a>
          <div class="hero-note">最新は第二版(2025.09.25更新)です</div>
        </div>
      </header>

      <main class="grid">
        <section class="panel panel-emulator" style="--delay: 0ms">
          <div class="panel-header">
            <h2 data-i18n="emulator">Emulator</h2>
            <span id="emulatorStatus" class="chip" data-i18n="idle">idle</span>
          </div>
          <select id="emulatorSelect" class="emulator-select"></select>
          <label class="field">
            <span>Offset (sec)</span>
            <input
              id="offsetSeconds"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              pattern="[0-9]*"
              value="15"
            />
          </label>
          <label class="field">
            <span>Search range</span>
            <input
              id="searchRangeSeconds"
              type="number"
              min="2"
              max="15"
              step="1"
              inputmode="numeric"
              pattern="[0-9]*"
              value="6"
            />
          </label>
          <div id="emulatorMeta" class="meta-line">manifest not loaded</div>
        </section>

        <section class="panel panel-input" style="--delay: 80ms">
          <div class="panel-header">
            <h2 data-i18n="input">Input</h2>
            <span class="hint" data-i18n="inputHint">Enter runs, Shift+Enter adds a line</span>
          </div>
          <div class="field-row">
            <label class="field">
              <span data-i18n="workers">Workers</span>
              <input id="threads" type="number" min="1" max="32" value="2" />
            </label>
            <button id="runButton" class="run-button" data-i18n="run">Run Search</button>
          </div>
          <textarea
            id="actionInput"
            class="action-input"
            placeholder="1 27 2 a25 11 b a78 12 r 21 22 a25"
          ></textarea>
        </section>

        <section class="panel panel-dump" style="--delay: 160ms">
          <div class="panel-header">
            <h2 data-i18n="dump">Dump Table</h2>
            <span id="seedState" class="chip chip-accent" data-i18n="waiting">waiting</span>
          </div>
          <textarea
                  id="dumpOutput"
                  class="dump-output"
                  readonly
                  wrap="off"
          ></textarea>
        </section>

        <section class="panel panel-settings" style="--delay: 200ms">
          <div class="panel-header">
            <h2 data-i18n="settings">Settings</h2>
            <span class="hint" data-i18n="settingsHint">Theme and language</span>
          </div>
          <div class="settings-grid">
            <label class="field">
              <span data-i18n="theme">Theme</span>
              <select id="themeSelect"></select>
            </label>
            <label class="field">
              <span data-i18n="language">Language</span>
              <select id="langSelect">
                <option value="ja">日本語</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="field field-inline">
              <span data-i18n="preload">Preload</span>
              <div class="toggle">
                <input id="preloadToggle" type="checkbox" />
                <div class="toggle-ui"></div>
              </div>
            </label>
          </div>
        </section>

        <section class="panel panel-seed" style="--delay: 120ms">
          <div class="panel-header">
            <h2 data-i18n="seed">Seed</h2>
          </div>
          <div class="seed-grid">
            <div class="seed-label" data-i18n="seedHex">Hex</div>
            <div id="seedHex" class="seed-value">-</div>
            <div class="seed-label" data-i18n="speed">Speed</div>
            <div id="seedSpeed" class="seed-value">-</div>
            <div class="seed-label" data-i18n="elapsed">Elapsed</div>
            <div id="seedElapsed" class="seed-value">-</div>
            <div class="seed-label" data-i18n="seedDrift">Drift</div>
            <div id="seedDrift" class="seed-value">-</div>
          </div>
        </section>

        <section class="panel panel-log" style="--delay: 240ms">
          <div class="panel-header">
            <h2 data-i18n="log">Log</h2>
            <span class="hint" data-i18n="logHint">session output</span>
          </div>
          <textarea id="logOutput" class="log-output" readonly></textarea>
        </section>
      </main>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
